<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>푸른숲 주문 정리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="푸른숲">
<meta name="theme-color" content="#1E6B3C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 맨 위 푸른숲, 그 아래 구분 탭, 본문은 좌측 목록 + 우측 상세. 글씨는 항상 크게. */
:root{
  --bg:#F4F7F3; --surface:#FFFFFF; --ink:#18241C; --muted:#586A5E; --line:#D9E2DA;
  --brand:#1E6B3C; --on-brand:#FFFFFF; --brand-soft:#E1EFE5;
  --pay:#2150B8; --pay-soft:#E2EAFA; --got:#1E6B3C; --got-soft:#DAEEDF; --late:#A25A00; --late-soft:#FAE8CC;
  --staff-bg:#EDEFF3; --staff-ink:#555D6C; --danger:#B3261E; --focus:#1E6B3C;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#222222; --paper-faint:#6B6B6B;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --k1:#FBD9DB; --k2:#DDF1CB; --k3:#FFF1B8; --k4:#D6E8F7;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111915; --surface:#1A251F; --ink:#E7F0EA; --muted:#9DB0A4; --line:#2C3B32;
  --brand:#5CC184; --on-brand:#0B2415; --brand-soft:#1E3A2A;
  --pay:#93B3FF; --pay-soft:#1E2B4A; --got:#7FD3A0; --got-soft:#1C3A27; --late:#F0B45E; --late-soft:#42320F;
  --staff-bg:#232A31; --staff-ink:#A9B1BD; --danger:#FF8A80; --focus:#5CC184; --k1:#4A2A2D; --k2:#2A3F25; --k3:#4A4220; --k4:#233A52; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1A251F; --ink:#E7F0EA; --muted:#9DB0A4; --line:#2C3B32;
  --brand:#5CC184; --on-brand:#0B2415; --brand-soft:#1E3A2A;
  --pay:#93B3FF; --pay-soft:#1E2B4A; --got:#7FD3A0; --got-soft:#1C3A27; --late:#F0B45E; --late-soft:#42320F;
  --staff-bg:#232A31; --staff-ink:#A9B1BD; --danger:#FF8A80; --focus:#5CC184; --k1:#4A2A2D; --k2:#2A3F25; --k3:#4A4220; --k4:#233A52; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:15px}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5;margin:0;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{position:relative;z-index:1;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:.25rem 16px 0}
.tr{display:flex;align-items:center;justify-content:space-between;gap:.4rem .8rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem}
.brand h1{font-size:1.2rem;font-weight:800;margin:0;letter-spacing:-.02em}
.brand svg{width:1.4rem;height:1.4rem;flex:none}
.up-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:.6rem;padding:.25rem .6rem;font-size:.78rem;font-weight:700;color:var(--muted)}
.up-btn:hover{border-color:var(--brand);color:var(--brand)}
.hbtns{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.up-btn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:.1rem}
nav button{border:0;border-bottom:3px solid transparent;background:none;padding:.35rem .1rem .3rem;font-weight:700;font-size:.84rem;color:var(--muted);white-space:nowrap;text-align:center}
nav button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:800}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:.6rem;padding:.3rem .8rem;font-weight:700;min-height:2.4rem;font-size:.9rem}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:.15rem .6rem;min-height:2rem;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:default}

.main{flex:1;display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);width:100%}
.main.wide{display:block;padding:.7rem 16px 3rem}
.list{border-right:1px solid var(--line);background:var(--surface);padding:.55rem 16px;overflow:auto;max-height:calc(100vh - var(--hh,6rem));position:sticky;top:var(--hh,6rem);align-self:start}
.detail{padding:.6rem 16px 4rem;min-width:0}
.search{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:.6rem;padding:.3rem .7rem;margin-bottom:.4rem;font-size:.9rem}
.li{display:block;width:100%;text-align:left;border:1.5px solid transparent;background:none;border-radius:.7rem;padding:.4rem .55rem;margin-bottom:.1rem}
.li:hover{background:var(--bg)}
.li[aria-current="true"]{background:var(--brand-soft);border-color:var(--brand)}
.li b{display:block;font-weight:700;font-size:.98rem;line-height:1.3;overflow-wrap:anywhere}
.li small{display:block;color:var(--muted);font-size:.72rem;line-height:1.35}
.hint{color:var(--muted);font-size:.8rem;margin:.2rem 0 .5rem}
.seg{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:.4rem}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:2rem;padding:.12rem .6rem;font-size:.78rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}

.dh{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .6rem;margin-bottom:.25rem}
.dh .back{display:none}
.title-in{font-size:1.2rem;font-weight:800;border:0;border-bottom:2px dashed transparent;background:none;padding:.1rem 0;min-width:0;flex:1 1 0;letter-spacing:-.01em}
.ptag{font-weight:800;color:var(--brand);white-space:nowrap;font-size:1rem}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line)}
.date-in{border:1.5px solid var(--line);background:var(--surface);border-radius:.5rem;padding:.1rem .4rem;font-size:.75rem}
.sum{display:flex;flex-wrap:wrap;gap:.3rem;margin:.2rem 0 .5rem;align-items:center}
.pill{display:inline-flex;gap:.3rem;align-items:baseline;border-radius:.5rem;background:var(--surface);border:1px solid var(--line);padding:.05rem .5rem;font-size:.75rem}
.pill b{font-variant-numeric:tabular-nums}
.pill.p{background:var(--pay-soft);border-color:transparent;color:var(--pay)}
.pill.g{background:var(--got-soft);border-color:transparent;color:var(--got)}
.pill.l{background:var(--late-soft);border-color:transparent;color:var(--late)}
.bar{display:flex;flex-wrap:wrap;gap:.35rem .6rem;align-items:center;margin-bottom:.5rem}
.bar .search{margin:0;flex:1 1 100%;width:auto}
.bar .seg{margin:0;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}
.bar .seg button{flex:none;white-space:nowrap}

.blk{background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:.5rem .65rem;margin-bottom:.45rem}
.cm.st .tx{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.bh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.2rem .5rem;margin-bottom:.15rem}
.bh h3{margin:0;font-size:1.02rem;font-weight:800;overflow-wrap:anywhere;flex:0 1 auto;line-height:1.3}
.bh h3 small{font-weight:500;color:var(--muted);font-size:.65rem;margin-left:.3rem}
.chips{display:flex;gap:.2rem;flex-wrap:nowrap;margin-left:auto}
.chip[aria-pressed="mixed"]{border-style:dashed;border-color:var(--brand);color:var(--ink)}
#blocks{column-width:19rem;column-gap:.7rem}
#blocks .blk{break-inside:avoid}
#blocks .hint{column-span:all}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:.5rem .65rem .6rem;margin:0 0 .5rem}
.stat h3{margin:0 0 .25rem;font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.sg{display:grid;grid-template-columns:minmax(0,1.4fr) 3.4rem 2.4rem 2.4rem 5.4rem 3rem 3rem 1.2rem;gap:.25rem;align-items:center;padding:.15rem 0}
.sg.hd{font-size:.66rem;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);padding-bottom:.15rem}
.sg.hd span:first-child{text-align:left}
.sg input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:.45rem;padding:.2rem .25rem;font-size:.85rem;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.sg input.nm{text-align:left;font-weight:700}
.sg input::-webkit-outer-spin-button,.sg input::-webkit-inner-spin-button,.qi input::-webkit-outer-spin-button,.qi input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sg .v{text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
.sg .ok{color:var(--got)}
.sg .bad{color:var(--danger)}
.sg .os{display:flex;align-items:center;gap:.15rem}
.sg .os button{border:1.5px solid var(--line);background:var(--surface);border-radius:.4rem;width:1.5rem;min-height:1.6rem;font-weight:800;padding:0}
.sg .os b{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.sg .x{height:1.6rem;font-size:.9rem}
.ssum{display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:baseline;padding:.1rem 0;font-size:.88rem;font-variant-numeric:tabular-nums}
.ssum b{min-width:3rem}
.ssum .ok{color:var(--got);font-weight:800}
.ssum .bad{color:var(--danger);font-weight:800}
.qtxt{margin:.05rem 0 .2rem;font-size:.82rem;color:var(--muted);font-weight:700}
.stat .warn{color:var(--late);font-size:.74rem;margin:.2rem 0 0}
.qrow{display:flex;flex-wrap:wrap;gap:.35rem .8rem;margin:.1rem 0 .25rem}
.qi{display:flex;align-items:center;gap:.3rem;font-size:.78rem;color:var(--muted)}
.qi b{font-weight:700;color:var(--ink);max-width:7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi input{width:3.1rem;border:1.5px solid var(--line);background:var(--bg);border-radius:.45rem;padding:.2rem .2rem;font-size:.9rem;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qi .qa{width:1.3rem}
.qi .qa button{min-height:1rem}
@media (min-width:700px){.qi input{width:3.6rem;padding:.35rem .2rem}.qi .qa button{min-height:1.3rem}}
.bdel{display:flex;justify-content:flex-end;margin-top:.15rem}
.bdel .btn{color:var(--muted);font-weight:500}
.hid{margin:0 0 .5rem}
.hid .hr{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.2rem .1rem;border-bottom:1px solid var(--line)}
.bst{display:flex;gap:.25rem;flex-wrap:wrap;margin-left:auto}
@media (min-width:700px){.chip{min-height:2.7rem;padding:.1rem .6rem}}
.chip{display:inline-flex;align-items:center;gap:.2rem;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:2rem;padding:.1rem .42rem;font-weight:700;min-height:2.2rem;font-size:.8rem}
.chip::before{content:"";width:.75rem;height:.75rem;border-radius:.2rem;border:1.8px solid currentColor;flex:none}
.chip[aria-pressed="true"]::before{background:currentColor;box-shadow:inset 0 0 0 2px var(--surface)}
.chip.pay[aria-pressed="true"]{background:var(--pay-soft);border-color:var(--pay);color:var(--pay)}
.chip.got[aria-pressed="true"]{background:var(--got-soft);border-color:var(--got);color:var(--got)}
.chip.late[aria-pressed="true"]{background:var(--late-soft);border-color:var(--late);color:var(--late)}
.th{border-left:2px solid var(--line);padding-left:.5rem;margin:.15rem 0}
.cm{display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:.3rem;padding:.05rem 0;font-size:.95rem;line-height:1.4}
.cm .no{color:var(--muted);font-size:.65rem;font-variant-numeric:tabular-nums;padding-top:.2rem;text-align:right}
.cm .tx{overflow-wrap:anywhere;white-space:pre-wrap}
.cm .tm{color:var(--muted);font-size:.65rem;margin-left:.3rem;white-space:nowrap}
.cm.reply{margin-left:1rem}
.cm.reply .no::before{content:"↳ "}

.who{font-size:.62rem;font-weight:700;border-radius:.4rem;padding:.02rem .4rem;margin-right:.4rem;background:var(--staff-bg);color:var(--staff-ink);border:1px solid var(--line)}

.empty{max-width:34rem;margin:3rem auto;text-align:center;border:2px dashed var(--line);border-radius:1.2rem;padding:2rem 1.2rem;background:var(--surface)}
.empty h2{margin:.2rem 0 .5rem;font-size:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:.55rem .7rem .65rem;margin:0 auto .6rem;max-width:46rem}
.card h2{margin:0 0 .3rem;font-size:.9rem;color:var(--muted)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 5.8rem 1.8rem;gap:.3rem;margin-bottom:.3rem}
.pr input:first-child{grid-column:1/-1}
.pr input{border:1.5px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.3rem .5rem;min-width:0;font-size:.9rem}
.opt{display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin:.35rem 0}
.opt label{display:flex;align-items:center;gap:.3rem;font-size:.8rem}
.opt input{width:1rem;height:1rem;accent-color:var(--brand)}
.postsel{display:flex;flex-wrap:wrap;gap:.1rem .8rem}
label.opt{display:flex;align-items:center;gap:.3rem;font-size:.8rem}
.pvwrap{margin-top:.6rem;background:var(--staff-bg);border-radius:1rem;padding:1rem .5rem;overflow:hidden}

/* 계산기 */
.cwrap{max-width:46rem;margin:0 auto}
.cbar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.cbar .btn.primary{flex:1 1 10rem}
.quick{display:flex;flex-wrap:wrap;gap:.3rem}
.qb{display:inline-flex;align-items:baseline;gap:.35rem;border:1.5px solid var(--line);background:var(--bg);border-radius:2rem;padding:.2rem .65rem}
.qb:hover{border-color:var(--brand);background:var(--brand-soft)}
.qb b{font-weight:700;font-size:.9rem}
.qb[data-cat="과일"],.pr[data-cat="과일"],.crow[data-cat="과일"],.cgh[data-cat="과일"]{background:var(--k1)}
.qb[data-cat="야채"],.pr[data-cat="야채"],.crow[data-cat="야채"],.cgh[data-cat="야채"]{background:var(--k2)}
.qb[data-cat="당일공구"],.pr[data-cat="당일공구"],.crow[data-cat="당일공구"],.cgh[data-cat="당일공구"]{background:var(--k3)}
.qb[data-cat="밀키트"],.pr[data-cat="밀키트"],.crow[data-cat="밀키트"],.cgh[data-cat="밀키트"]{background:var(--k4)}
.qb[data-cat]:hover{background:var(--brand-soft)}
.pr[data-cat],.crow[data-cat]{padding:.2rem .3rem;border-radius:.5rem}
.cgh[data-cat]{display:inline-block;padding:.05rem .6rem;border-radius:2rem;color:var(--ink)}
.qb small{color:var(--muted);font-size:.72rem}
.chead,.crow{display:grid;grid-template-columns:minmax(0,1fr) 4.6rem 3.8rem 4.2rem 1.4rem;gap:.25rem;align-items:center}
.chead{font-size:.68rem;color:var(--muted);padding:0 0 .1rem}
.chead span:nth-child(n+2){text-align:center}
.chead span:nth-child(4){text-align:right}
.crow{padding:.15rem 0;border-bottom:1px solid var(--line)}
.crow input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.3rem .35rem;font-size:.92rem;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.crow input::-webkit-outer-spin-button,.crow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.crow input[aria-label="수량"]{text-align:center}
.crow input[aria-label="단가(원)"]{text-align:right}
.qcell{display:flex;align-items:stretch;gap:.15rem;min-width:0}
.qcell input{flex:1}
.qa{display:flex;flex-direction:column;gap:2px;width:1.35rem;flex:none}
.qa button{flex:1;min-height:.95rem;border:1.5px solid var(--line);background:var(--surface);border-radius:.3rem;font-size:.6rem;line-height:1;padding:0;color:var(--ink)}
.qa button:active{background:var(--brand-soft);border-color:var(--brand)}
.amt{text-align:right;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);font-size:1rem;border-radius:.4rem;padding:0;height:2rem}
.cgh{font-size:.72rem;font-weight:800;color:var(--brand);margin:.45rem 0 .1rem}
.qg{margin-bottom:.35rem}
.ql{display:block;font-size:.72rem;font-weight:800;color:var(--brand);margin-bottom:.15rem}
.nm-in{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.3rem .5rem;margin-bottom:.35rem;font-size:.92rem}
.pr select{border:1.5px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.3rem .15rem;font-size:.85rem;min-width:0}
.rc{background:var(--surface);border:1.5px dashed var(--line);border-radius:.6rem;padding:.55rem .75rem;margin-bottom:.6rem;max-width:34rem}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;border-bottom:1px dashed var(--line);padding-bottom:.3rem;margin-bottom:.25rem}
.rc-h b{font-size:1.05rem;overflow-wrap:anywhere}
.rc-h span{font-size:.72rem;color:var(--muted);white-space:nowrap}
.rc-g{font-size:.7rem;font-weight:800;color:var(--brand);margin:.3rem 0 .05rem}
.rc-l{display:grid;grid-template-columns:minmax(0,1fr) auto 4.8rem;gap:.4rem;padding:.08rem 0;font-size:.92rem;font-variant-numeric:tabular-nums}
.rc-l .m{color:var(--muted);font-size:.8rem;text-align:right}
.rc-l b{text-align:right}
.rc-t{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);margin-top:.4rem;padding-top:.3rem;font-weight:800}
.rc-t b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.rc-a{display:flex;gap:.4rem;margin-top:.45rem}
.cgrid{display:grid;gap:.6rem;grid-template-columns:minmax(0,1fr)}
.ccol .card{max-width:none;margin:0 0 .6rem}
.ccol .cbar{margin-bottom:.4rem}
@media (min-width:1180px){
  .cgrid{grid-template-columns:minmax(0,1fr) minmax(0,22rem);align-items:start}
  .ccol{position:sticky;top:calc(var(--hh,6rem) + .6rem);max-height:calc(100vh - var(--hh,6rem) - 1.2rem);overflow:auto;padding-right:2px}
}
.ctotal .tt{display:flex;align-items:center;gap:.7rem}
.ctotal .sv{background:var(--on-brand);color:var(--brand);border:0;border-radius:.6rem;padding:.3rem .9rem;font-weight:800;font-size:.95rem;min-height:2.2rem}
.ctotal .sv[disabled]{opacity:.5}
.ctotal{position:sticky;bottom:calc(.4rem + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--brand);color:var(--on-brand);border-radius:.8rem;padding:.35rem .9rem;margin-top:.5rem;font-size:.9rem}
.ctotal b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:1.2rem;padding:1.2rem;width:100%;max-width:40rem}
.modal h2{margin:0 0 .3rem}
.up{border:1px solid var(--line);border-radius:.9rem;padding:.7rem;margin:.6rem 0;display:grid;gap:.4rem}
.up input{border:1.5px solid var(--line);background:var(--bg);border-radius:.6rem;padding:.4rem .6rem;width:100%}
.up .meta{color:var(--muted);font-size:.8rem}
.up .err{color:var(--danger);font-size:.85rem}
.mact{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.8rem;flex-wrap:wrap}
.drop{position:fixed;inset:0;z-index:60;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;opacity:.94}
